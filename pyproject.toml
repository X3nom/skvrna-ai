[project]
name = "skvrna-ai"
version = "0.1.0"
description = "SunSCC segmentation reimplementation (paper: doi:10.1029/2023JA031548)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # deep learning
    "torch>=2.4,<2.7",          # cu12x wheel (local driver supports CUDA 12.2)
    "lightning>=2.4",
    "torchmetrics>=1.4",
    "albumentations>=1.4",
    # config
    "hydra-core>=1.3.2",
    "omegaconf>=2.3",
    # data / solar
    "astropy>=6.0",
    "numpy<2.3",
    "scipy>=1.13",
    "scikit-image>=0.24",
    "opencv-python-headless>=4.10",
    # utils
    "tqdm>=4.66",
    "matplotlib>=3.9",
    "tensorboard>=2.17",
    "jupyterlab>=4.2",
    "ipywidgets>=8.1",
    "ipympl>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
sunscc-generate-masks = "sunscc.cli.generate_masks:main"
sunscc-train = "sunscc.cli.train:main"
sunscc-predict = "sunscc.cli.predict:main"
sunscc-preprocess = "sunscc.cli.preprocess:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[tool.setuptools.packages.find]
where = ["sunscc-based-unet/src"]

[tool.ruff]
line-length = 100
target-version = "py311"
